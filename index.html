<title>Posts Promo da Kaah</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: bancada de trabalho. Controles à esquerda, o post em tamanho real à direita; no celular, empilha com o post logo abaixo dos campos. */
:root{
  --bg:#FFF4F7; --surface:#FFFFFF; --ink:#2B1A20; --muted:#7C6A70; --line:#F0D5DE;
  --pink:#E6177A; --pink-ink:#FFFFFF; --pink-soft:#FFE3EC; --ok:#1E8E4E; --warn:#B4541A;
  --ui:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Lora',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1216; --surface:#291B21; --ink:#FBEFF3; --muted:#B9A3AB; --line:#45303A;
  --pink:#FF4D9D; --pink-ink:#1C1216; --pink-soft:#4A2234; --ok:#5BD08D; --warn:#F0A066; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1216; --surface:#291B21; --ink:#FBEFF3; --muted:#B9A3AB; --line:#45303A;
  --pink:#FF4D9D; --pink-ink:#1C1216; --pink-soft:#4A2234; --ok:#5BD08D; --warn:#F0A066; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
.app{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:22px 40px;display:grid;gap:22px;
  grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}
@media(max-width:780px){.app{grid-template-columns:minmax(0,1fr)}}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:12px}
header.top img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--surface)}
h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.2}
header.top p{margin:0;color:var(--muted);font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:16px;min-width:0}
.field{display:grid;gap:6px;min-width:0}
label,.lab{font-weight:600;font-size:.85rem}
.hint{color:var(--muted);font-size:.78rem;font-weight:400}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;resize:vertical}
textarea:focus,input:focus,button:focus-visible,.drop:focus-within,.seg label:focus-within{outline:2px solid var(--pink);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;background:var(--bg);display:block;font-weight:400}
.drop b{color:var(--pink);font-weight:700}
.drop.over{border-color:var(--pink);background:var(--pink-soft)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:58px;height:58px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--ink);
  color:var(--surface);font-size:13px;line-height:1;cursor:pointer;padding:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:.85rem;background:var(--bg)}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--pink);border-color:var(--pink);color:var(--pink-ink);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.btn{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--pink);border-color:var(--pink);color:var(--pink-ink);font-weight:700;font-size:1.02rem;padding:14px 18px;width:100%}
.btn[disabled]{opacity:.55;cursor:default}
details summary{cursor:pointer;font-weight:600;font-size:.85rem}
details .inner{display:grid;gap:14px;margin-top:12px}
.stage{display:grid;gap:12px;justify-items:center;min-width:0}
#preview{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block;background:#fff}
.pv{position:relative;width:100%;max-width:440px}
#pega{position:absolute;cursor:grab;touch-action:none}
#pega.on{cursor:grabbing}
.thumb.sel img{outline:2px solid var(--pink);outline-offset:1px}
.thumb img{cursor:pointer}
.status{font-size:.85rem;color:var(--muted);text-align:center;min-height:1.3em;margin:0}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.dl{width:100%;max-width:440px;display:grid;gap:8px}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <img id="topLogo" alt="">
    <div><h1>Gerador de posts</h1><p>Escreva o título, envie a imagem e baixe o post pronto para o Instagram.</p></div>
  </header>

  <section class="panel" aria-label="Conteúdo do post">
    <div class="field">

const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const W=1080, cv=document.createElement('canvas'), cx=cv.getContext('2d');

function setLogo(src,salvar){
  const im=new Image();
  im.onload=()=>{logo=im;$('logoPrev').src=src;$('topLogo').src=src;if(salvar)store.set('pk_logo2',src);draw()};
  im.onerror=()=>{if(src!==LOGO_PADRAO)setLogo(LOGO_PADRAO)};
  im.src=src;
}
function cover(f,x,y,w,h){ // f.fx/f.fy: parte da foto que aparece (0 a 1); f.z: zoom
  const im=f.im, r=Math.max(w/im.width,h/im.height)*f.z, sw=w/r, sh=h/r;
  cx.drawImage(im,(im.width-sw)*f.fx,(im.height-sh)*f.fy,sw,sh,x,y,w,h);
}

    let l='';
    for(const p of par.split(/\s+/).filter(Boolean)){
      const t=l?l+' '+p:p;
      if(cx.measureText(t).width>max&&l){out.push(l);l=p}else l=t;
    }
    out.push(l);
  }
  return out.filter((l,i,a)=>l||i<a.length-1);
}
function selar(bx,by,r){
  cx.save();cx.fillStyle='#1D9BF0';cx.beginPath();cx.arc(bx,by,r*.8,0,Math.PI*2);cx.fill();
  for(let i=0;i<8;i++){const a=i*Math.PI/4;cx.beginPath();cx.arc(bx+Math.cos(a)*r*.7,by+Math.sin(a)*r*.7,r*.3,0,Math.PI*2);cx.fill()}
  cx.strokeStyle='#fff';cx.lineWidth=r*.2;cx.lineCap='round';cx.lineJoin='round';
  cx.beginPath();cx.moveTo(bx-r*.36,by+r*.02);cx.lineTo(bx-r*.1,by+r*.28);cx.lineTo(bx+r*.38,by-r*.26);cx.stroke();cx.restore();
}
function equilibra(txt,max){ // mesma quantidade de linhas, com larguras parecidas
  const base=linhas(txt,max);if(base.length<2)return base;
  let lo=max*.4,hi=max;
  for(let i=0;i<12;i++){const m=(lo+hi)/2;if(linhas(txt,m).length<=base.length)hi=m;else lo=m}
  return linhas(txt,hi);
}
function marca(x,y,w,h){ // marca d'água discreta: só o @, translúcido, no canto da imagem
  const arroba=$('arroba').value.trim();if(!arroba)return;
  cx.save();cx.font='600 22px Poppins, sans-serif';cx.textAlign='right';cx.textBaseline='alphabetic';
  cx.globalAlpha=.6;cx.fillStyle='#fff';cx.shadowColor='rgba(0,0,0,.55)';cx.shadowBlur=5;cx.shadowOffsetY=1;
  cx.fillText(arroba,x+w-18,y+h-18,w-36);cx.restore();
}
function celulas(n,x,y,w,h){
  const g=10,hw=(w-g)/2,hh=(h-g)/2;
  if(n===1)return[[x,y,w,h]];
  if(n===2)return[[x,y,hw,h],[x+hw+g,y,hw,h]];
  if(n===3)return[[x,y,hw,h],[x+hw+g,y,hw,hh],[x+hw+g,y+hh+g,hw,hh]];
  return[[x,y,hw,hh],[x+hw+g,y,hw,hh],[x,y+hh+g,hw,hh],[x+hw+g,y+hh+g,hw,hh]];
}
function draw(oy){
  oy=typeof oy==='number'?oy:0;
  const H=+document.querySelector('input[name=fmt]:checked').value, P=76, cw=W-2*P;
  cv.width=W;cv.height=H;
  cx.fillStyle='#fff';cx.fillRect(0,0,W,H);
  // cabeçalho: logo + nome + @
  const D=132, ay=70+oy, selo=$('selo').checked, gap=28, sg=selo?14:0;
  const nome=$('nome').value.trim()||'Promo da Kaah', arroba=$('arroba').value.trim();
  let fs=52, sw, nw;
  do{fs-=2;cx.font=`800 ${fs}px Poppins, sans-serif`;sw=selo?fs*.86:0;nw=cx.measureText(nome).width+sg+sw}
  while(D+gap+nw>cw&&fs>26);
  cx.font='500 31px Poppins, sans-serif';const aw=cx.measureText(arroba).width;
  const gx=Math.max(P,(W-(D+gap+Math.max(nw,aw)))/2), nx=gx+D+gap; // grupo centralizado na largura da imagem
  cx.save();cx.beginPath();cx.arc(gx+D/2,ay+D/2,D/2,0,Math.PI*2);cx.clip();
  if(logo.width)cx.drawImage(logo,gx,ay,D,D);else{cx.fillStyle='#E6177A';cx.fillRect(gx,ay,D,D)}
  cx.restore();
  cx.textBaseline='alphabetic';cx.fillStyle='#111';
  cx.font=`800 ${fs}px Poppins, sans-serif`;cx.fillText(nome,nx,ay+62);
  if(selo){
    selar(nx+nw-sw/2,ay+62-fs*.36,sw/2);
  }
  cx.font='500 31px Poppins, sans-serif';cx.fillStyle='#8A8F98';
  cx.fillText(arroba,nx,ay+108);
  // título: encolhe até sobrar espaço para a imagem
  const serif=$('fSerif').checked, txt=$('titulo').value.trim(), minImg=H*0.42;
  let ts=serif?62:56, ls, lh, ty=ay+D+52;
  do{cx.font=serif?`400 ${ts}px Lora, Georgia, serif`:`700 ${ts}px Poppins, sans-serif`;
     ls=txt?equilibra(txt,cw):[];lh=ts*1.24;ts-=3}
  while(ty+ls.length*lh+36>H-P-minImg&&ts>30);
  cx.fillStyle='#141414';cx.textBaseline='top';
  ls.forEach((l,i)=>cx.fillText(l,P,ty+i*lh));
  // imagens
  const iy=ty+ls.length*lh+(ls.length?34:0), ih=H-P-iy;
  if(fotos.length){
    if(fotos.length===1&&!$('cheio').checked){ // uma imagem: aparece inteira; com zoom, arrasta para escolher a parte
      const im=fotos[0].im, k=Math.min(cw/im.width,ih/im.height), dw=im.width*k, dh=im.height*k;
      if(!oy&&ih-dh>2)return draw((ih-dh)/2); // sobra espaço: centraliza o conjunto na altura
      const dx=P+(cw-dw)/2;cels=[[dx,iy,dw,dh]];cover(fotos[0],dx,iy,dw,dh);
      if($('marca').checked)marca(dx,iy,dw,dh);
    }else{
      cels=celulas(fotos.length,P,iy,cw,ih);cels.forEach((c,i)=>cover(fotos[i],...c));
      if($('marca').checked)marca(P,iy,cw,ih);
    }
  }else{
    cels=[];
    cx.fillStyle='#FFE3EC';cx.fillRect(P,iy,cw,ih);
    cx.fillStyle='#D63867';cx.font='600 40px Poppins, sans-serif';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText('Sua imagem entra aqui',W/2,iy+ih/2);cx.textAlign='left';
  }
  $('preview').src=cv.toDataURL('image/jpeg',.9);
  const pg=$('pega');pg.hidden=!fotos.length;
  pg.style.cssText=`left:${P/W*100}%;top:${iy/H*100}%;width:${cw/W*100}%;height:${ih/H*100}%`;
  $('ajuste').hidden=!fotos.length;if(sel>=fotos.length)sel=0;
  if(fotos.length)$('zoom').value=fotos[sel].z;
  $('cheioRow').hidden=fotos.length!==1;
}
function agenda(){clearTimeout(timer);timer=setTimeout(draw,120)}
function msg(t,c){const s=$('status');s.textContent=t;s.className='status'+(c?' '+c:'')}

function lerArquivo(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function addFotos(files){
  for(const f of [...files].filter(f=>f.type.startsWith('image/'))){
    if(fotos.length>=4){msg('O post aceita até 4 imagens.','warn');break}
    const src=await lerArquivo(f), im=new Image();
    await new Promise(r=>{im.onload=r;im.onerror=r;im.src=src});
    if(im.width){fotos.push({im,src,fx:.5,fy:.4,z:1});sel=fotos.length-1}
  }
  thumbs();draw();
}
function thumbs(){
  const t=$('thumbs');t.textContent='';
  fotos.forEach((f,i)=>{
    const d=document.createElement('div');d.className='thumb'+(i===sel?' sel':'');
    const im=document.createElement('img');im.src=f.src;im.alt='Imagem '+(i+1);im.onclick=()=>{sel=i;thumbs();draw()};
    const b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label','Remover imagem '+(i+1));
    b.onclick=()=>{fotos.splice(i,1);thumbs();draw()};
    d.append(im,b);t.append(d);
  });
}
// arrastar a foto na prévia para escolher a parte que aparece; roda do mouse ou controle para o zoom
const pega=$('pega');let arr=null;
function ponto(e){const b=$('preview').getBoundingClientRect(),k=W/b.width;return[(e.clientX-b.left)*k,(e.clientY-b.top)*k,k]}
function pinta(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})}
pega.addEventListener('pointerdown',e=>{
  const [x,y]=ponto(e),i=cels.findIndex(c=>x>=c[0]&&x<=c[0]+c[2]&&y>=c[1]&&y<=c[1]+c[3]);if(i<0)return;
  if(i!==sel){sel=i;thumbs();$('zoom').value=fotos[i].z}
  arr={i,x:e.clientX,y:e.clientY};pega.setPointerCapture(e.pointerId);pega.classList.add('on');e.preventDefault();
});
pega.addEventListener('pointermove',e=>{
  if(!arr)return;const f=fotos[arr.i],c=cels[arr.i],k=ponto(e)[2];if(!f||!c)return;
  const r=Math.max(c[2]/f.im.width,c[3]/f.im.height)*f.z, rx=f.im.width*r-c[2], ry=f.im.height*r-c[3];
  if(rx>1)f.fx=Math.min(1,Math.max(0,f.fx-(e.clientX-arr.x)*k/rx));
  if(ry>1)f.fy=Math.min(1,Math.max(0,f.fy-(e.clientY-arr.y)*k/ry));
  arr.x=e.clientX;arr.y=e.clientY;pinta();
});
['pointerup','pointercancel'].forEach(n=>pega.addEventListener(n,()=>{arr=null;pega.classList.remove('on')}));
pega.addEventListener('wheel',e=>{
  const [x,y]=ponto(e),i=cels.findIndex(c=>x>=c[0]&&x<=c[0]+c[2]&&y>=c[1]&&y<=c[1]+c[3]);if(i<0)return;
  e.preventDefault();sel=i;fotos[i].z=Math.min(3,Math.max(1,fotos[i].z*(e.deltaY<0?1.06:1/1.06)));thumbs();pinta();
},{passive:false});
$('zoom').oninput=()=>{if(fotos[sel]){fotos[sel].z=+$('zoom').value;pinta()}};
$('cheio').onchange=draw;
$('centro').onclick=()=>{if(fotos[sel]){Object.assign(fotos[sel],{fx:.5,fy:.4,z:1});draw()}};
$('arquivo').onchange=e=>{addFotos(e.target.files);e.target.value=''};
const drop=$('drop');
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>addFotos(e.dataTransfer.files));
document.addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();addFotos(fs)}});
$('logoFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{ // reduz para caber no armazenamento do navegador
    const c=document.createElement('canvas');c.width=c.height=300;const g=c.getContext('2d');
    const s=Math.min(im.width,im.height);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,300,300);
    setLogo(c.toDataURL('image/jpeg',.9),true)};
  im.src=await lerArquivo(f);e.target.value='';
};
$('titulo').oninput=agenda;$('selo').onchange=draw;$('marca').onchange=draw;
$('nome').oninput=()=>{store.set('pk_nome',$('nome').value);agenda()};
$('arroba').oninput=()=>{store.set('pk_arroba2',$('arroba').value);agenda()};
document.querySelectorAll('input[name=fmt],input[name=fonte]').forEach(r=>r.onchange=()=>{
  store.set('pk_fonte',$('fSans').checked?'sans':'serif');draw()});

$('baixar').onclick=async()=>{
  draw();
  if(!dl){
    const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='promo-da-kaah-post.png';
    document.body.appendChild(a);a.click();a.remove();msg('Post baixado. Agora é só publicar no Instagram.','ok');return}
  const b=$('baixar');b.disabled=true;msg('Preparando o arquivo…');
  try{
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    const nome=($('titulo').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'post');
    await dl.save({filename:'promo-da-kaah-'+nome+'.png',data:blob});
    msg('Post salvo. Agora é só publicar no Instagram.','ok');
  }catch(e){
    if(e&&e.code==='declined')msg('Download cancelado.');
    else if(e&&e.code==='rate_limited')msg('Já existe um pedido de download aberto. Confirme ou feche e tente de novo.','warn');
    else msg('Não deu para baixar por aqui. Segure o dedo na imagem e escolha "Salvar imagem".','warn');
  }
  b.disabled=false;
};

setLogo(store.get('pk_logo2',LOGO_PADRAO));
draw();
if(document.fonts&&document.fonts.ready){
  Promise.all([document.fonts.load('800 50px Poppins'),document.fonts.load('500 31px Poppins'),document.fonts.load('700 56px Poppins'),document.fonts.load('400 62px Lora')]).then(draw,()=>{});
}
window.claude?.use?.('downloads').then(d=>{dl=d},()=>{});
</script>
